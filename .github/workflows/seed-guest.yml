name: Reset guest demo data

# The streak on the dashboard counts back from today, so seeded entries go
# stale: within a couple of weeks the demo reads 0 and looks abandoned again.
# This also wipes whatever visitors typed into the shared guest account.
on:
  # PAUSED during the workspace rebuild. The job now migrates production
  # before seeding, so leaving it on a schedule would apply half-finished
  # migrations overnight -- and once the migration history is squashed, the
  # revision production is stamped at stops existing and every run fails.
  # Re-enable once the migrations settle.
  # schedule:
  #   - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: # still runnable by hand, from the Actions tab

concurrency:
  group: seed-guest
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt; the dependencies have no wheels for 3.13+.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      # Seeds are written against the models at HEAD, so the schema has to get
      # there first. Without this the job fails the moment a migration lands
      # that production has not had applied.
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: python -m scripts.seed_guest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
