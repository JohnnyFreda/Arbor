name: Reset guest demo data

# The streak on the dashboard counts back from today, so seeded entries go
# stale: within a couple of weeks the demo reads 0 and looks abandoned again.
# This also wipes whatever visitors typed into the shared guest account.
on:
  # Resumed: the migrations settled at c3f81a2b57d9, production is stamped
  # there and serving every endpoint, and the history was never squashed.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: # and on demand, from the Actions tab

concurrency:
  group: seed-guest
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt; the dependencies have no wheels for 3.13+.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      # Belt and braces. The Render start command migrates on deploy, so this
      # is normally a no-op -- but seeds are written against the models at
      # HEAD, and this job must not run against an older schema if a deploy
      # has not happened yet.
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: python -m scripts.seed_guest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
